@if (auth.isAuthenticated()) {
<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand">
      <span class="brand-dot"></span>
      WALON
    </a>

    <nav class="links">
      <!-- <a routerLink="/stadiums" routerLinkActive="active">Canchas</a> -->
      <a routerLink="/bookings" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Mis reservas</a>
      <a routerLink="/notifications" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Notificaciones</a>
    </nav>

    <div class="user">
      <span class="user-name">{{ auth.username() }}</span>
      <button class="btn btn-outline btn-sm" (click)="logout()">Salir</button>
    </div>
  </div>
</header>

<nav class="bottom-nav">
  <!-- <a routerLink="/stadiums" routerLinkActive="active">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor" d="M12 2 2 7v13h7v-6h6v6h7V7z" />
    </svg>
    <span>Canchas</span>
  </a> -->
  <a routerLink="/bookings" routerLinkActive="active">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor"
        d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14z" />
    </svg>
    <span>Reservas</span>
  </a>
  <a routerLink="/notifications" routerLinkActive="active">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor"
        d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1z" />
    </svg>
    <span>Alertas</span>
  </a>
  <button (click)="logout()">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor"
        d="M17 7l-1.41 1.41L17.17 10H9v2h8.17l-1.58 1.59L17 15l4-4zM5 5h7V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h7v-2H5z" />
    </svg>
    <span>Salir</span>
  </button>
</nav>
}
