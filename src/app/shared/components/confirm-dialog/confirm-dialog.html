@if (confirm.request(); as req) {
  <div class="confirm-backdrop" (click)="confirm.resolve(false)">
    <div class="confirm-card" (click)="$event.stopPropagation()">
      <h3>{{ req.title }}</h3>
      <p>{{ req.message }}</p>
      <div class="confirm-actions">
        <button class="btn btn-outline" (click)="confirm.resolve(false)">Cancelar</button>
        <button
          class="btn"
          [class.btn-danger]="req.danger"
          [class.btn-primary]="!req.danger"
          (click)="confirm.resolve(true)"
        >
          {{ req.confirmLabel ?? 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}
