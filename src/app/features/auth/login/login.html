<div class="auth-shell">
  <div class="auth-card card">
    <div class="auth-brand">
      <span class="brand-dot"></span>
      <h1>WALON</h1>
    </div>
    <p>Inicia sesión para reservar tu cancha</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="error">Ingresa un correo válido</span>
        }
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="error">La contraseña es requerida</span>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</div>
